name: Temporary frontend transitive security remediation

on:
  push:
    branches:
      - security/frontend-transitive-fixes
    paths:
      - .github/workflows/refresh-transitives-once.yml

permissions:
  contents: write

jobs:
  remediate-and-verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: be-the-hero/front-end
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply nonbreaking npm advisory fixes
        run: npm audit fix --package-lock-only --lockfile-version=1 --ignore-scripts --no-fund
      - name: Reject unexpected direct dependency changes
        run: git diff --exit-code -- package.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Require audit to pass
        run: npm audit --audit-level=high
      - name: Commit validated transitive lockfile fixes
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be-the-hero/front-end/package-lock.json
          git diff --cached --quiet && { echo "No transitive changes"; exit 1; }
          git commit -m "security(frontend): patch vulnerable transitive dependencies"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/security/frontend-transitive-fixes
