name: Be The Hero frontend checks

on:
  push:
    paths:
      - "be-the-hero/front-end/**"
      - ".github/workflows/frontend-checks.yml"
  pull_request:
    paths:
      - "be-the-hero/front-end/**"
      - ".github/workflows/frontend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be-the-hero/front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: be-the-hero/front-end/package-lock.json
      - name: Audit all locked dependencies
        run: npm audit --audit-level=high

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be-the-hero/front-end
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: be-the-hero/front-end/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
