name: Temporary Supertest dependency upgrade

on:
  push:
    branches:
      - security/supertest-7-upgrade
    paths:
      - .github/workflows/refresh-supertest-once.yml

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: be-the-hero/back-end
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upgrade only Supertest
        run: npm install supertest@7.1.4 --save-dev --save-exact --package-lock-only --lockfile-version=1 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Execute HTTP integration and unit regressions
        run: npm test -- --runInBand
      - name: Commit tested dependency manifests
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be-the-hero/back-end/package.json be-the-hero/back-end/package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "test(backend): upgrade Supertest HTTP test helper"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/security/supertest-7-upgrade
      - name: Report remaining dependency advisories
        run: npm audit --audit-level=high
