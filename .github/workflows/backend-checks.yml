name: Be The Hero backend checks

on:
  push:
    paths:
      - "be-the-hero/back-end/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "be-the-hero/back-end/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be-the-hero/back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: be-the-hero/back-end/package-lock.json
      - name: Audit all locked dependencies
        run: npm audit --audit-level=high

  production-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be-the-hero/back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: be-the-hero/back-end/package-lock.json
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be-the-hero/back-end
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: be-the-hero/back-end/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run existing Jest tests
        run: npm test -- --runInBand
