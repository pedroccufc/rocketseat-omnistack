name: Temporary Knex upgrade verification

on:
  push:
    branches:
      - security/knex-3-upgrade
    paths:
      - .github/workflows/refresh-knex-once.yml

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: be-the-hero/back-end
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upgrade Knex only
        run: npm install knex@3.3.0 --save-exact --package-lock-only --lockfile-version=1 --ignore-scripts --no-audit --no-fund
      - name: Install resolved dependencies
        run: npm ci --no-audit --no-fund
      - name: Execute database-backed Jest regressions
        run: npm test -- --runInBand
      - name: Commit verified Knex manifests
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be-the-hero/back-end/package.json be-the-hero/back-end/package-lock.json
          git diff --cached --quiet && { echo "No package changes generated"; exit 1; }
          git commit -m "security(backend): migrate Knex to supported v3"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/security/knex-3-upgrade
