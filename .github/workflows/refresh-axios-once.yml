name: Temporary Axios upgrade verification

on:
  push:
    branches:
      - security/frontend-axios-1
    paths:
      - .github/workflows/refresh-axios-once.yml

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: be-the-hero/front-end
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update Axios only
        run: npm install axios@1.21.1 --save-exact --package-lock-only --lockfile-version=1 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Commit validated manifests
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be-the-hero/front-end/package.json be-the-hero/front-end/package-lock.json
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "security(frontend): upgrade Axios to patched 1.x"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/security/frontend-axios-1
