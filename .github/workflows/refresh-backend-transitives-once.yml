name: Temporary backend transitive security remediation

on:
  push:
    branches:
      - security/backend-transitive-fixes
    paths:
      - .github/workflows/refresh-backend-transitives-once.yml

permissions:
  contents: write

jobs:
  remediate-and-measure:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: be-the-hero/back-end
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply npm patches that do not require force
        run: |
          npm audit fix --package-lock-only --lockfile-version=1 --ignore-scripts --no-fund || echo "::notice::Some advisories require separate incompatible dependency updates"
      - name: Reject direct dependency edits
        run: git diff --exit-code -- package.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run backend tests
        run: npm test -- --runInBand
      - name: Commit tested lockfile updates
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be-the-hero/back-end/package-lock.json
          git diff --cached --quiet && { echo "No lockfile changes"; exit 1; }
          git commit -m "security(backend): patch compatible transitive dependencies"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/security/backend-transitive-fixes
      - name: Report remaining high and critical advisories
        run: npm audit --audit-level=high
