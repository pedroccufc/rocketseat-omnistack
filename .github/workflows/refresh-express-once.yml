name: Temporary Express upgrade verification

on:
  push:
    branches:
      - security/express-4-update
    paths:
      - .github/workflows/refresh-express-once.yml

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: be-the-hero/back-end
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update Express within major 4
        run: npm install express@4.22.3 --save-exact --package-lock-only --lockfile-version=1 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Jest regression suite
        run: npm test -- --runInBand
      - name: Commit verified Express dependency changes
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be-the-hero/back-end/package.json be-the-hero/back-end/package-lock.json
          git diff --cached --quiet && { echo "No dependency changes"; exit 1; }
          git commit -m "security(backend): upgrade Express 4 to patched release"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/security/express-4-update
