name: Temporary sqlite3 lockfile refresh

on:
  push:
    branches:
      - security/sqlite3-node22
    paths:
      - .github/workflows/refresh-sqlite3-once.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: be-the-hero/back-end
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update only sqlite3 and its dependency lock
        run: npm install sqlite3@5.1.7 --save-exact --package-lock-only --lockfile-version=1 --ignore-scripts --no-audit --no-fund
      - name: Install locked packages
        run: npm ci --no-audit --no-fund
      - name: Run backend regression tests
        run: npm test -- --runInBand
      - name: Commit verified manifests
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be-the-hero/back-end/package.json be-the-hero/back-end/package-lock.json
          git diff --cached --quiet && { echo "No package changes generated"; exit 1; }
          git commit -m "security(backend): upgrade sqlite3 for Node 22 compatibility"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/security/sqlite3-node22
