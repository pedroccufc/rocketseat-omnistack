name: Temporary Nodemon upgrade validation
on:
  push:
    branches:
      - security/nodemon-3-upgrade
    paths:
      - .github/workflows/refresh-nodemon-once.yml
permissions:
  contents: write
jobs:
  upgrade-and-verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: be-the-hero/back-end
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update Nodemon only
        run: npm install nodemon@3.1.14 --save-dev --save-exact --package-lock-only --lockfile-version=1 --ignore-scripts --no-audit --no-fund
      - name: Install packages
        run: npm ci --no-audit --no-fund
      - name: Run all backend Jest tests
        run: npm test -- --runInBand
      - name: Check Nodemon startup compatibility
        run: ./node_modules/.bin/nodemon --version
      - name: Commit updated manifests
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add be-the-hero/back-end/package.json be-the-hero/back-end/package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "chore(backend): upgrade Nodemon 3"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/security/nodemon-3-upgrade
      - name: Report remaining vulnerabilities
        run: npm audit --audit-level=high
